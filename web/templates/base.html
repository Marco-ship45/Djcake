{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Cake{% endblock %}</title>

    <meta name="description" content="Pastelería Cake - Pasteles artesanales y noticias de repostería">
    <meta name="keywords" content="pasteles, repostería, postres, cake">
    <meta name="author" content="Equipo Cake">

    <link rel="icon" href="{% static 'img/fav.png' %}">

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

   
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
</head>

<body>

    {% include 'includes/header.html' %}

    <main class="container mt-4">
        {% block content %}
        {% endblock %}
    </main>

    {% include 'includes/footer.html' %}

  
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    
    <script src="{% static 'js/script.js' %}"></script>

</body>
</html>
